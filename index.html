<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9">
<title>Tapis Domyos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#121826; --muted:#5B6474; --line:#E6E9F0; --track:#E3E7EF;
  --acc:#2F56E0; --acc-ring:#3D6BFF; --acc-soft:#E3EAFF; --acc-ink:#1E3FB0; --acc-pale:#C9D6FF;
  --ok-bg:#E2F6EA; --ok:#17663A; --warn-bg:#FFF1DC; --warn:#8A4B00; --err-bg:#FDE4E1; --err:#A3281B;
  --shadow:0 10px 30px rgba(18,24,38,0.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 96px)}
#app.nonav{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
h1{font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:0}
h2{font-size:17px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:18px;min-height:48px;padding:0 18px;cursor:pointer;
  background:var(--acc-soft);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button.primary{background:var(--acc);color:#fff}
button.white{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
button.ghost{background:transparent;color:var(--acc);padding:0 4px;min-height:44px;font-weight:600}
button.danger{background:var(--err-bg);color:var(--err)}
button.big{min-height:60px;font-size:17px;border-radius:20px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc-ring);outline-offset:2px}
.full{width:100%}
input[type=text],input[type=password]{font:inherit;font-size:16px;width:100%;min-height:50px;border-radius:16px;border:1.5px solid var(--line);padding:0 14px;background:var(--card);color:var(--ink)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.err{background:var(--err-bg);color:var(--err)}
.tile{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.seg{display:flex;background:#E6E9F0;border-radius:16px;padding:4px}
.seg button{flex:1;min-height:42px;border-radius:12px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(18,24,38,0.08)}
.bars{display:flex;align-items:flex-end;gap:3px}
.bars > div{border-radius:5px;min-width:2px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;border:0;width:100%;text-align:left;font:inherit;color:inherit;min-height:64px}
.item .ic{width:44px;height:44px;border-radius:14px;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted);margin-top:1px}
.item .grow{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:5}
nav.tabs[hidden]{display:none}
nav.tabs button{background:none;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;padding:0;border-radius:0}
nav.tabs button.on{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal div{height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.ring{position:relative;align-self:center}
.ring svg{position:absolute;inset:0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stepper{display:flex;gap:8px;margin-top:10px}
.stepper button{flex:1;min-height:48px;border-radius:14px;padding:0}
.stepper button.minus{background:var(--bg);color:var(--ink)}
.banner{border-radius:18px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--err-bg);color:var(--err)}
.overlay{position:fixed;inset:0;background:rgba(18,24,38,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.count{width:180px;height:180px;border-radius:50%;background:var(--acc);color:#fff;font-size:88px;font-weight:800;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:30;max-width:90%}
.profcard{background:var(--card);border-radius:28px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow);border:0;font:inherit;color:inherit;cursor:pointer;outline:2.5px solid transparent}
.profcard.sel{outline-color:var(--acc-ring)}
label.check{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;min-height:44px;cursor:pointer}
label.check input{width:22px;height:22px;margin:0;accent-color:var(--acc)}
@media (prefers-reduced-motion: no-preference){ .count{animation:pop .9s ease-out infinite} @keyframes pop{0%{transform:scale(.8)}30%{transform:scale(1)}} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
